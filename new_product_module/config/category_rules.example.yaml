rug_analysis_thresholds:
  doormat:
    source: "门垫"
    cvr: "x>=7.5% | 5%<=x<7.5% | 3.5%<=x<5% | 0%<=x<3.5%"
    acos: "0%<=x<=30% | 30%<x<55% | 55%<=x<75% | x>=75%"
    cpa: "$0<=x<=$10 | $10<x<$13 | $13<=x<$18 | x>=$18"
    cpa_normal_upper: 13
  runner:
    source: "长条，原始基准来源2x5"
    cvr: "x>=8% | 5.5%<=x<8% | 3.5%<=x<5.5% | 0%<=x<3.5%"
    acos: "0%<=x<=25% | 25%<x<45% | 45%<=x<65% | x>=65%"
    cpa: "$0<=x<=$9 | $9<x<$13 | $13<=x<$20 | x>=$20"
    cpa_normal_upper: 13
  area_small:
    source: "5x7小区域"
    cvr: "x>=5.5% | 3.5%<=x<5.5% | 2.5%<=x<3.5% | 0%<=x<2.5%"
    acos: "0%<=x<=25% | 25%<x<45% | 45%<=x<65% | x>=65%"
    cpa: "$0<=x<=$15 | $15<x<$22 | $22<=x<$35 | x>=$35"
    cpa_normal_upper: 22
  area_large:
    source: "8x10大区域"
    cvr: "x>=5% | 3%<=x<5% | 2%<=x<3% | 0%<=x<2%"
    acos: "0%<=x<=20% | 20%<x<35% | 35%<=x<50% | x>=50%"
    cpa: "$0<=x<=$15 | $15<x<$24 | $24<=x<$40 | x>=$40"
    cpa_normal_upper: 24
  round:
    source: "待配置"
    cvr: null
    acos: null
    cpa: null
    cpa_normal_upper: null

