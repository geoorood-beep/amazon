version: "2026-06-25-sop-6-2-validation"
site: "US"
category: "Rugs"
effective_date: "2026-06-25"
owner: "SOP 6.2 validation fixture"

rug_type_baselines:
  area_rug:
    ctr_baseline: null
    cvr_baseline: 0.043
    cpa_normal_line: null
    cpa_high_risk_line: null
    acos_target: null
    min_click_sample: 20
    min_order_sample: 2
  runner:
    ctr_baseline: null
    cvr_baseline: null
    cpa_normal_line: null
    cpa_high_risk_line: null
    acos_target: null
    min_click_sample: null
    min_order_sample: null
  doormat:
    ctr_baseline: null
    cvr_baseline: null
    cpa_normal_line: null
    cpa_high_risk_line: null
    acos_target: null
    min_click_sample: null
    min_order_sample: null
  round:
    ctr_baseline: null
    cvr_baseline: null
    cpa_normal_line: null
    cpa_high_risk_line: null
    acos_target: null
    min_click_sample: null
    min_order_sample: null

global_ctr_baseline: null

rug_size_type_mapping:
  runner_sizes: ["2x6"]
  runner_short_widths: [2.5]
  doormat_sizes: ["2x3"]
  area_sizes: ["5x7", "5x8"]
  area_small_max_square_feet: 57.5

order_stage_aba_table:
  - stage: "0-10单/日"
    min_daily_orders: 0
    max_daily_orders: 15
    area_rug_aba_range: [25000, 500000]
    runner_aba_range: [50000, 800000]
    keyword_types: ["长尾词", "尺寸词", "场景词", "属性组合词"]
    min_match_score: 90
    max_keyword_count: 5

candidate_pool_thresholds:
  min_independent_order_dates: 3
  min_click_sample: null
  min_order_sample: null

scoring_weights:
  transaction_data: 0.60
  region_match: 0.15
  spec_match: 0.15
  style_match: 0.05
  color_match: 0.05
  cvr_score_multiplier: 2

attribute_scoring:
  region:
    partial_match_score: 60
    hard_conflict_terms: []
    known_terms: ["living room", "bedroom", "hallway"]
  spec:
    partial_match_score: 50
    hard_conflict_terms: []
    known_terms: []
  style:
    partial_match_score: 50
    hard_conflict_terms: []
    known_terms: ["vintage", "modern"]
  color:
    partial_match_score: 50
    neutral_score: 50
    hard_conflict_terms: []
    known_terms: ["blue", "red", "green", "black", "white", "gray", "grey"]
  keyword_score_overrides:
    5x8 vintage blue area rug:
      transaction_data_score: 100
      region_score: 100
      spec_score: 100
      style_score: 100
      color_score: 100
budget_formula:
  product_coefficient_by_stage:
    new_test: 0.8
    scaling: 1.2
    default: 1.0

strategy_rules:
  match_type_routing:
    status: "USER_APPROVED_PROVISIONAL_TEST_ONLY"
    threshold_source: "thresholds/rug/match-type-routing.md"
    eligible_relevance_levels: ["HIGH", "MEDIUM"]
    root_monthly_volume_bands:
      no_standalone_lt: 3000
      conditional_group_lt: 10000
      broad_test_lt: 30000
      phrase_priority_lt: 100000
    root_concentration:
      sparse_query_phrase_max: 3
      mixed_top3_share_gte: 0.35
      phrase_top3_share_gte: 0.60
    minimum_complete_months: 1
    preferred_complete_months: 3
  ad_group_rank_bands:
    single_keyword_max_rank: 30000
    multi_keyword_max_rank: 100000
    max_keywords_per_group: 5
  category_big_word_terms: ["rug", "rugs", "area rug", "area rugs"]

bid_defaults:
  词组: 0.95
  广泛: 0.6
  default: 0.8

placement_defaults:
  词组: "TOS 20%; ROS保持; PP保持"
  广泛: "TOS 0%; ROS保持; PP保持"
  default: "保持"

risk_constraints:
  inventory_redline: null
  profit_redline: null
  max_test_spend: 1000
